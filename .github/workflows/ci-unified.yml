# STAGING ACCEPTANCE COPY for Updog_restore ADR-107. Reduced CI: the change
# classifier, the Release Baseline Prerequisite feeder, and CI Gate Status.
# The classify step, the release-baseline job, and the gate re-fence step are
# copied verbatim from Updog_restore main 909671a3f. Mock data only; no secrets.
name: CI Unified

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: Kept for parity with the production classify step.
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      change_classification_valid: ${{ steps.classify.outputs.valid }}
      release_baseline_plan_touched: ${{ steps.classify.outputs.release_baseline_plan_touched }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0


      - name: Classify light and heavy CI paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual run on a candidate branch must still report the scoped
            # release plan so it cannot stand in for pull_request CI (ADR-107).
            release_baseline_plan_touched=false
            if [[ "$REF_NAME" != "refs/heads/main" ]]; then
              head_sha="$(git rev-parse HEAD)"
              merge_base="$(git merge-base origin/main "$head_sha")"
              if [[ "$merge_base" != "$head_sha" ]]; then
                release_baseline_plan_touched="$(node scripts/ci/classify-change-paths.mjs \
                  --base "$merge_base" \
                  --head "$head_sha" \
                  --filters .github/path-filters.yml | jq -r '.releaseBaselinePlanTouched')"
              fi
            fi
            {
              echo "valid=true"
              echo "auto_docs_only=false"
              echo "heavy_ci_relevant=true"
              echo "financial_calc_relevant=${{ github.event.inputs.run_full_suite == 'true' }}"
              echo "change_count=manual"
              echo "release_baseline_plan_touched=$release_baseline_plan_touched"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/ci/classify-change-paths.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --filters .github/path-filters.yml \
            --github-output "$GITHUB_OUTPUT"

  release-baseline:
    name: Release Baseline Prerequisite
    # Scoped to the exact F_1.21.1 release plan path (ADR-107). Runs verifier
    # code from protected main only; the candidate head is read as Git data
    # and API evidence, never checked out or executed.
    needs: changes
    if: needs.changes.outputs.release_baseline_plan_touched == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      baseline_main_sha: ${{ steps.verify.outputs.baseline_main_sha }}
    steps:
      - name: Require pull_request CI
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::The release baseline prerequisite is satisfied only by pull_request CI."
          exit 1

      - name: Checkout protected main verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js without dependency install
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.2'

      - name: Verify pre-merge release baseline
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/premerge-baseline.json"
          node scripts/release/capture-release-recovery-context.mjs verify-premerge \
            --pr-number "$PR_NUMBER" \
            --pr-head-sha "$PR_HEAD_SHA" > "$result"
          baseline_main_sha="$(jq -r '.baselineMainSha' "$result")"
          [[ "$baseline_main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "baseline_main_sha=$baseline_main_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Release baseline prerequisite"
            echo ""
            echo "Verified pre-merge capture binding for the owner release dispatch:"
            echo ""
            echo '```json'
            jq '.' "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: CI Gate Status
    needs:
      - changes
      - release-baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine gate status
        id: status
        run: |
          fail=0

          changes_result="${{ needs.changes.result }}"
          change_classification_valid="${{ needs.changes.outputs.change_classification_valid }}"
          release_baseline_plan_touched="${{ needs.changes.outputs.release_baseline_plan_touched }}"
          release_baseline_result="${{ needs.release-baseline.result }}"
          release_baseline_expected="${{ needs.changes.outputs.release_baseline_plan_touched == 'true' && github.ref != 'refs/heads/main' }}"

          validate_boolean() {
            local name="$1"
            local value="$2"
            if [[ "$value" != "true" && "$value" != "false" ]]; then
              echo "$name output is missing or malformed: $value"
              fail=1
            fi
          }

          validate_boolean "change-classification-valid" "$change_classification_valid"
          validate_boolean "release-baseline-plan-touched" "$release_baseline_plan_touched"

          if [[ "$change_classification_valid" != "true" ]]; then
            echo "Change classification is invalid"
            fail=1
          fi
          if [[ "$changes_result" != "success" ]]; then
            echo "Change detection failed: $changes_result"
            fail=1
          fi

          require_result() {
            local name="$1"
            local result="$2"
            local expected="$3"

            if [[ "$expected" == "true" && "$result" != "success" ]]; then
              echo "$name failed or skipped: $result"
              fail=1
            elif [[ "$expected" != "true" && "$result" != "skipped" ]]; then
              echo "$name had unexpected result: $result"
              fail=1
            fi
          }

          require_result "Release baseline prerequisite" "$release_baseline_result" "$release_baseline_expected"

          {
            echo "## CI Gate Inputs (staging)"
            echo ""
            echo "| Job | Result | Expected |"
            echo "| --- | --- | --- |"
            echo "| release-baseline | $release_baseline_result | $release_baseline_expected |"
            echo "| release-baseline-plan-touched | $release_baseline_plan_touched | informational |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$fail" -ne 0 ]]; then
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Re-fence scoped release candidate
        if: needs.release-baseline.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_MAIN_SHA: ${{ needs.release-baseline.outputs.baseline_main_sha }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          candidate="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '[.state, .head.sha] | join(" ")')"
          if [[ "$candidate" != "open ${PR_HEAD_SHA}" ]]; then
            echo "::error::The scoped release candidate is no longer open at the verified head."
            exit 1
          fi
          live_main="$(gh api "repos/${REPO}/commits/main" --jq '.sha')"
          if [[ "$live_main" != "$BASELINE_MAIN_SHA" ]]; then
            echo "::error::main moved after baseline verification; update the branch and recapture."
            exit 1
          fi
